[pytest]
# Pytest configuration for slackbot-ghostwriter

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Markers for categorizing tests
markers =
    integration: marks tests as integration tests that make real API calls (deselect with '-m "not integration"')
    unit: marks tests as unit tests with no external dependencies

# Output options
addopts = 
    -v
    --strict-markers
    --tb=short

# Test paths
testpaths = tests

# Minimum Python version
minversion = 7.0
